name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The landing page (website/, deployed by Vercel): unit tests, build, browser tests.
  website:
    name: website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Browser tests (builds first)
        run: npx playwright install --with-deps chromium && npm run e2e

  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Unsigned builds in v1 (see README "Unsigned app warnings").
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The Electron postinstall download is occasionally skipped; make sure the binary exists.
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Lint, format and typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: e2e (Playwright + Electron)
        run: npm run e2e

      - name: Package
        run: npm run dist

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 3

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: devdock-${{ matrix.os }}
          path: |
            release/*/*.dmg
            release/*/*.exe
          if-no-files-found: error
          retention-days: 3
