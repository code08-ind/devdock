name: Website

# Builds website/ and publishes it to GitHub Pages. Manual only (Actions → Website → Run
# workflow): the owner decides when the site goes live. Needs Settings → Pages → Source:
# "GitHub Actions" once.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      # The page links to the latest *published* release (drafts don't count). With none, no
      # releases.json is written and the page says "Downloads coming soon".
      - name: releases.json from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/releases/latest" > "$RUNNER_TEMP/latest.json" 2>/dev/null; then
            node scripts/releases-json.mjs "$RUNNER_TEMP/latest.json" public/releases.json
          else
            echo "No published release yet: the page will say Downloads coming soon."
          fi

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
