appId: com.devdock.app
productName: DevDock
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
# Small packages (P6.14): every library is bundled into out/ (no node_modules; their licenses
# are in out/THIRD_PARTY_NOTICES.txt), Electron's UI strings only in English (macOS keeps
# en.lproj, Windows en-US.pak), maximum compression.
electronLanguages: [en, en-US]
compression: maximum
asarUnpack: []
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  extendInfo:
    LSUIElement: false
  # Unsigned in v1; see README "Unsigned app warnings".
  identity: null
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
extraResources:
  - from: build/tray
    to: tray
