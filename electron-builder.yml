appId: com.devdock.app
productName: DevDock
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  # node-pty (P7-A) is the one runtime node_module: only its JS and its own OS's binaries.
  - '!node_modules/node-pty/{src,deps,third_party,scripts,typings}/**'
  - '!node_modules/node-pty/binding.gyp'
  - '!node_modules/node-pty/**/*.pdb'
  - '!node_modules/node-addon-api/**'
# Small packages (P6.14): every library is bundled into out/ (no node_modules except node-pty;
# their licenses are in out/THIRD_PARTY_NOTICES.txt), Electron's UI strings only in English
# (macOS keeps en.lproj, Windows en-US.pak), maximum compression.
electronLanguages: [en, en-US]
compression: maximum
# node-pty loads pty.node and starts spawn-helper / winpty-agent from disk, so they can't live
# inside the asar (node-pty looks in app.asar.unpacked itself).
asarUnpack:
  - node_modules/node-pty/prebuilds/**
# node-pty's prebuilds are N-API (one binary per OS + arch, any Electron), so nothing is
# compiled at package time: the arm64 DMG loads prebuilds/darwin-arm64, x64 darwin-x64,
# Windows win32-x64 (DECISIONS P7-A).
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  files:
    - '!node_modules/node-pty/prebuilds/win32-*/**'
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  extendInfo:
    LSUIElement: false
  # Unsigned in v1; see README "Unsigned app warnings".
  identity: null
win:
  icon: build/icon.ico
  files:
    - '!node_modules/node-pty/prebuilds/darwin-*/**'
    - '!node_modules/node-pty/prebuilds/win32-arm64/**'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup.${ext}
portable:
  artifactName: ${productName}-Portable.${ext}
dmg:
  artifactName: ${productName}-${arch}.${ext}
extraResources:
  - from: build/tray
    to: tray
